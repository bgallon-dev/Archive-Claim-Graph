name: ci

on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e ".[dev,retrieval,ingest]"
      - name: Lint
        # Non-blocking until the one-time mechanical cleanup commit
        # (`ruff check --fix gemynd && ruff format gemynd`) lands and the tree
        # is green. Flip to blocking by deleting continue-on-error then.
        continue-on-error: true
        run: ruff check gemynd
      - name: Test (no Neo4j required)
        run: pytest -m "not integration"
      # Enable these once the baselines are green:
      # - name: Format check
      #   run: ruff format --check gemynd
      # - name: Type check (core + shared first)
      #   run: mypy gemynd/core gemynd/shared
