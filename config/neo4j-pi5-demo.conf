# Isolated local runtime for the Pi 5 newspapers backup.
# This instance is loopback-only and does not share ports or data with Neo4j Desktop.

initial.dbms.default_database=newspapers
dbms.security.auth_enabled=true

server.memory.heap.initial_size=256m
server.memory.heap.max_size=1g
server.memory.pagecache.size=512m
dbms.memory.transaction.total.max=256m

server.default_listen_address=127.0.0.1
server.default_advertised_address=localhost

server.bolt.enabled=true
server.bolt.listen_address=:7689
server.bolt.advertised_address=:7689

# Enterprise starts internal standalone/cluster transports even for a
# single-server demo. Move them away from Neo4j Desktop's default ports.
server.cluster.listen_address=:6001
server.cluster.advertised_address=:6001
server.cluster.raft.listen_address=:7001
server.cluster.raft.advertised_address=:7001
server.routing.listen_address=:7690
server.routing.advertised_address=:7690

# The clone is disposable and backed up by its immutable source artifact.
# Keeping the online backup listener disabled also avoids Desktop's port 6362.
server.backup.enabled=false
server.fleet_discovery.enabled=false
dbms.fleet_manager.enabled=false
dbms.usage_report.enabled=false

server.http.enabled=true
server.http.listen_address=:7475
server.http.advertised_address=:7475
server.http.x_forward.enabled=false

server.https.enabled=false
