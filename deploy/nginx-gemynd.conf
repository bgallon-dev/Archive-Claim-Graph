# Reverse proxy + TLS termination for the Gemynd query server.
#
#   sudo cp deploy/nginx-gemynd.conf /etc/nginx/sites-available/gemynd
#   sudo ln -s /etc/nginx/sites-available/gemynd /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is not optional here. Authentication is a JWT in a cookie; over plain
# HTTP on an institutional network that session token is sniffable by anyone
# on the wire. The app binds to 127.0.0.1 so this is the only way in.
#
# COOKIE_SECURE and this file are coupled: set COOKIE_SECURE=true in .env
# ONLY once TLS actually terminates here. Setting it true without TLS makes
# login fail *silently* — the browser accepts the response and drops the
# cookie, so the user is bounced back to the login page with no error.

upstream gemynd_query {
    server 127.0.0.1:8788;
    keepalive 16;
}

server {
    listen 80;
    server_name gemynd.example.org;          # <-- change

    # ACME challenge for certificate issuance/renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gemynd.example.org;          # <-- change

    ssl_certificate     /etc/letsencrypt/live/gemynd.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gemynd.example.org/privkey.pem;

    # An internal-only institutional host may not be able to get a public
    # certificate. A private CA or self-signed cert is fine — what matters is
    # that the connection is encrypted, not who vouches for it.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Synthesis is a live LLM call and can legitimately run 30-120s. The
    # nginx default of 60s would cut a slow-but-working query off mid-answer
    # and show the tester a 504 — which reads as "broken", not "slow".
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # PDF/JSON uploads only matter if ingest is exposed; the tester-facing
    # pilot is retrieval-only. Kept modest deliberately — the app does not
    # enforce its own upload cap yet, so this is the backstop.
    client_max_body_size 64m;

    location / {
        proxy_pass http://gemynd_query;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # IMPORTANT: set TRUSTED_PROXY_IPS in .env to this proxy's address.
        # Without it the app sees every request as coming from the proxy, so
        # login rate limiting collapses into ONE shared bucket for the whole
        # institution — one user fumbling a password locks out everyone.
    }

    # Static assets are content-hashed by nobody, so keep the cache short;
    # they're small and local either way.
    location /static/ {
        proxy_pass http://gemynd_query;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location = /health {
        proxy_pass http://gemynd_query;
        access_log off;
    }
}
