upstream kettle_mcp {
    server 127.0.0.1:8789;
    keepalive 16;
}

server {
    listen 80;
    server_name evidence.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name evidence.example.org;

    ssl_certificate /etc/letsencrypt/live/evidence.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evidence.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 256k;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location = /mcp {
        proxy_pass http://kettle_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Public x402 resources. Nginx forwards Payment-Signature to the app and
    # Payment-Required / Payment-Response back to the buyer by default.
    location ^~ /paid/ {
        proxy_pass http://kettle_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ^~ /public/ {
        proxy_pass http://kettle_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location ~ ^/(health|ready)$ {
        proxy_pass http://kettle_mcp;
        access_log off;
    }

    location / {
        return 404;
    }
}
