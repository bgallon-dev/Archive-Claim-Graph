version: "1"
domain: turnbull_refuge_archive
description: >
  Historical wildlife refuge annual reports, Turnbull National Wildlife
  Refuge, eastern Washington, 1930s-1970s.
resources:
  seed_entities: seed_entities.csv
  claim_type_patterns: claim_type_patterns.yaml
  claim_role_policy: claim_role_policy.yaml
  measurement_units: measurement_units.yaml
  measurement_species: measurement_species.yaml
  measurement_patterns: measurement_patterns.yaml
  ocr_corrections: ocr_corrections.yaml
  claim_relation_compatibility: claim_relation_compatibility.yaml
  negative_entities: negative_entities.yaml
  derivation_registry: derivation_registry.yaml
  domain_schema: domain_schema.yaml
  concept_rules: concept_rules.yaml
  query_intent: query_intent.yaml
  validator_verbs: validator_verbs.yaml

# Source-parser profile (relocated from hardcoded defaults in source_parser.py).
# default_doc_type: doc_type assigned when a document's payload omits one.
# untitled_title:   title fallback when payload has no title/doc_title.
# filename_inference: named rules applied to the source filename. "loc_sequence"
#   enables the Library-of-Congress trailing-4-digit image sequence (?sp=) and
#   the unpadded-edition normalization (no-ops on non-LoC filenames, so this is
#   behavior-preserving for the Turnbull narrative reports).
source_profile:
  default_doc_type: narrative_report
  untitled_title: Untitled Narrative Report
  filename_inference: [loc_sequence]

year_validation:
  tolerance: 5
  action: flag
  min_year: 1800
  max_year: 2029

# Entity-type-keyed analytical query dispatch. The retrieval web layer picks
# the first resolved entity whose type matches a key here and calls the
# corresponding CypherQueryBuilder method with entity_id bound to `param`.
analytical_queries:
  Species:
    builder: species_trend
    param: species_id
  Habitat:
    builder: habitat_conditions
    param: habitat_id

# Text-to-Cypher LLM fallback (plan B6). Default off; opt in per domain.
# When true, queries that the rule-based router and its full relaxation
# chain cannot satisfy may be answered by an LLM-generated, validator-guarded
# Cypher query. Requires a configured Anthropic API key.
enable_llm_cypher: false

document_anchor:
  title_keywords:
    - tbl
    - turnbull
  entity_type: Refuge
  relation: ABOUT_REFUGE
  name: Turnbull
  normalized_form: turnbull
  hierarchy_child_types: [Place]
  hierarchy_relation: LOCATED_IN_REFUGE
  # Domain-specific stopwords filtered from query surface-form extraction.
  # Distinct from title_keywords: those drive ingest-time document anchoring,
  # these prevent generic domain words from being treated as queryable entities.
  extraction_stopwords:
    - refuge
  properties:
    refuge_id: turnbull_refuge
    name: Turnbull

institution_id: turnbull

synthesis_context: >
  historical wildlife refuge reports for the Turnbull National Wildlife
  Refuge (Washington State, USA)

expected_claim_shares:
  population_estimate: 0.22
  species_presence: 0.18
  management_action: 0.14
  habitat_condition: 0.10
  breeding_activity: 0.07
  migration_timing: 0.05
  weather_observation: 0.04
