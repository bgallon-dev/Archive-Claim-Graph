version: "1"

# Maps query vocabulary keywords to claim_type lists for retrieval scoping.
# Used by context_assembler to select retrieval strategy based on user query.
intent_to_claim_types:
  predator: [predator_control, management_action]
  coyote: [predator_control]
  trap: [predator_control, management_action]
  hunt: [predator_control, management_action]
  habitat: [habitat_condition, weather_observation]
  vegetation: [habitat_condition]
  wetland: [habitat_condition]
  marsh: [habitat_condition]
  weather: [weather_observation]
  drought: [weather_observation, habitat_condition]
  flood: [weather_observation, habitat_condition]
  snow: [weather_observation]
  rain: [weather_observation]
  temperature: [weather_observation]
  population: [population_estimate, species_presence, species_absence]
  count: [population_estimate]
  census: [population_estimate]
  estimate: [population_estimate]
  sighting: [species_presence]
  observed: [species_presence, population_estimate]
  absent: [species_absence]
  missing: [species_absence]
  breeding: [breeding_activity]
  nest: [breeding_activity]
  brood: [breeding_activity]
  hatch: [breeding_activity]
  migration: [migration_timing]
  arrival: [migration_timing]
  departure: [migration_timing]
  spring: [migration_timing, breeding_activity]
  fall: [migration_timing]
  fire: [fire_incident]
  burn: [fire_incident, management_action]
  prescribed: [fire_incident, management_action]
  wildfire: [fire_incident]
  management: [management_action, development_activity, economic_use]
  restoration: [management_action]
  grazing: [management_action, economic_use]
  logging: [development_activity, economic_use]
  timber: [development_activity, economic_use]
  construction: [development_activity]
  road: [development_activity]
