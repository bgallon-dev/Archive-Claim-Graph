[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemynd"
version = "0.1.0"
description = "Claim-centric narrative report extraction and Neo4j graph pipeline."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Codex" }
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20.0"]
dev = ["pytest>=8.0.0", "hypothesis>=6.0.0", "ruff>=0.15", "mypy>=1.20", "pre-commit>=3.7"]
local = ["openai>=1.0"]
tools = [
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "anthropic>=0.25",
]
retrieval = [
    "neo4j>=5.20.0",
    "anthropic>=0.25",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.7",
]
mcp = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
]
x402 = [
    "x402[extensions]>=2.22,<3",
    "cdp-sdk>=1.48,<2",
]
snapshot = [
    "neo4j>=5.20.0",
    "python-dotenv>=1.0",
]
ingest = [
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.7",
    "pymupdf>=1.24",
    "pytesseract>=0.3",
    "Pillow>=10.0",
]

[project.scripts]
gemynd = "gemynd.cli:main"
gemynd-create-admin = "gemynd.auth.seed:main"
gemynd-mcp = "gemynd.mcp.server:main"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: marks tests that require a live Neo4j instance (deselect with -m 'not integration')",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Start with the high-signal correctness rules plus import-sorting and a few
# safe modernizers. Widen this list as the tree is cleaned up.
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP", "SIM"]
# E501 line-length is noisy on this tree; B008 is the intentional FastAPI
# Depends()/Query() default-argument idiom used throughout the web apps.
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]        # re-exports
"tests/*" = ["F811", "F841"]    # fixture shadowing / bound-but-unused in tests

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
# Deliberately lax to start: many third-party deps are untyped/optional
# (neo4j, fastapi, jose, bcrypt, pymupdf, anthropic, openai). Tighten from the
# bottom of the import DAG (core, shared) outward.
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
exclude = "(^scripts/|^tools/|^notebooks/|kettle_eval)"

[[tool.mypy.overrides]]
module = ["gemynd.core.*", "gemynd.shared.*"]
disallow_untyped_defs = true

[tool.setuptools]
packages = [
    "gemynd",
    "gemynd.core",
    "gemynd.core.graph",
    "gemynd.shared",
    "gemynd.auth",
    "gemynd.ingest",
    "gemynd.ingest.web",
    "gemynd.ingest.extractors",
    "gemynd.ingest.graph",
    "gemynd.ingest.export",
    "gemynd.ingest.annotation",
    "gemynd.ingest.builders",
    "gemynd.ingest.enrichment",
    "gemynd.review",
    "gemynd.review.detectors",
    "gemynd.review.web",
    "gemynd.retrieval",
    "gemynd.retrieval.web",
    "gemynd.mcp",
]

[tool.setuptools.package-data]
"gemynd" = ["resources/*.yaml", "resources/*.csv"]
"gemynd.auth" = ["templates/*.html"]
"gemynd.ingest.web" = ["templates/*.html", "templates/fragments/*.html"]
"gemynd.review.web" = ["templates/*.html"]
"gemynd.retrieval.web" = ["templates/*.html", "templates/fragments/*.html"]
